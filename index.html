<body>

<div class="app">

    <main class="content">

        <!-- COVER -->
        <div class="cover-wrapper">
            <img
                class="cover"
                src="assets/cover.png"
                alt="Признание"
            >
        </div>

        <!-- TITLE -->
        <div class="title">
            <h1>Признание</h1>
            <p>Max Hunna</p>
        </div>

        <!-- PLAYER -->
        <div class="player">

            <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div
                class="progress-container"
                id="progressContainer"
                aria-label="Перемотка"
            >
                <div class="progress-track">
                    <div
                        class="progress-fill"
                        id="progressFill"
                    ></div>

                    <div
                        class="progress-thumb"
                        id="progressThumb"
                    ></div>
                </div>
            </div>

            <div class="controls">

                <button
                    class="play-button"
                    id="playButton"
                    aria-label="Воспроизвести"
                >
                    <span class="play-icon"></span>
                </button>

            </div>

        </div>

        <!-- LYRICS -->
        <section class="lyrics">

            <div
                class="lyrics-scroll"
                id="lyricsScroll"
            >
                <div
                    class="lyrics-empty"
                    id="lyricsEmpty"
                >
                    Загрузка текста…
                </div>
            </div>

        </section>

    </main>

</div>

<audio
    id="audio"
    preload="metadata"

>
    <source
        src="assets/song.mp3"
        type="audio/mpeg"
    >
</audio>

<script>
    /* TELEGRAM */

    const tg = window.Telegram?.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();

        if (tg.setHeaderColor) {
            tg.setHeaderColor("#4A050A");
        }

        if (tg.setBackgroundColor) {
            tg.setBackgroundColor("#4A050A");
        }
    }


    /* ELEMENTS */

    const audio = document.getElementById("audio");
    const playButton = document.getElementById("playButton");

    const progressContainer =
        document.getElementById("progressContainer");

    const progressFill =
        document.getElementById("progressFill");

    const progressThumb =
        document.getElementById("progressThumb");

    const currentTimeElement =
        document.getElementById("currentTime");

    const durationElement =
        document.getElementById("duration");

    const lyricsScroll =
        document.getElementById("lyricsScroll");

    const lyricsEmpty =
        document.getElementById("lyricsEmpty");


    /* LYRICS */

    let lyrics = [];
    let activeLyricIndex = -1;


    function parseLRC(text) {

        const result = [];

        const lines = text.split(/\r?\n/);

        for (const line of lines) {

            const matches = [
                ...line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)
            ];

            if (!matches.length) {
                continue;
            }

            const textPart = line
                .replace(/\[\d+:\d+(?:\.\d+)?\]/g, "")
                .trim();

            for (const match of matches) {

                const minutes = Number(match[1]);
                const seconds = Number(match[2]);

                const time =
                    minutes * 60 +
                    seconds;

                result.push({
                    time,
                    text: textPart
                });
            }
        }

        result.sort((a, b) => a.time - b.time);

        return result;
    }


    async function loadLyrics() {

        try {

            const response =
                await fetch(
                    "assets/lyrics.lrc?version=" +
                    Date.now()
                );

            if (!response.ok) {
                throw new Error(
                    "LRC HTTP " + response.status
                );
            }

            const text = await response.text();

            lyrics = parseLRC(text);

            renderLyrics();

        } catch (error) {

            console.error(
                "Ошибка загрузки LRC:",
                error
            );

            lyricsEmpty.textContent =
                "Текст песни пока недоступен.";
        }
    }


    function renderLyrics() {

        lyricsScroll.innerHTML = "";

        if (!lyrics.length) {

            const empty =
                document.createElement("div");

            empty.className =
                "lyrics-empty";

            empty.textContent =
                "Текст песни пока недоступен.";

            lyricsScroll.appendChild(empty);

            return;
        }

        lyrics.forEach((line, index) => {

            const element =
                document.createElement("div");

            element.className =
                "lyric-line";

            element.dataset.index =
                index;

            element.textContent =
                line.text || " ";

            lyricsScroll.appendChild(element);
        });
    }


    function updateLyrics(time) {

        if (!lyrics.length) {
            return;
        }

        let newIndex = -1;

        for (let i = 0; i < lyrics.length; i++) {

            if (time >= lyrics[i].time) {
                newIndex = i;
            } else {
                break;
            }
        }

        if (newIndex === activeLyricIndex) {
            return;
        }

        activeLyricIndex = newIndex;

        const elements =
            lyricsScroll.querySelectorAll(".lyric-line");

        elements.forEach((element, index) => {

            element.classList.toggle(
                "active",
                index === activeLyricIndex
            );
        });

        if (activeLyricIndex >= 0) {

            const activeElement =
                elements[activeLyricIndex];

            if (activeElement) {

                activeElement.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });
            }
        }
    }


    /* PLAYER */

    function formatTime(seconds) {

        if (!Number.isFinite(seconds)) {
            return "0:00";
        }

        const minutes =
            Math.floor(seconds / 60);

        const secs =
            Math.floor(seconds % 60);

        return (
            minutes +
            ":" +
            String(secs).padStart(2, "0")
        );
    }


    function updatePlayButton() {

        if (audio.paused) {

            playButton.innerHTML =
                '<span class="play-icon"></span>';

            playButton.setAttribute(
                "aria-label",
                "Воспроизвести"
            );

        } else {

            playButton.innerHTML = `
                <span class="pause-icon">
                    <span></span>
                    <span></span>
                </span>
            `;

            playButton.setAttribute(
                "aria-label",
                "Пауза"
            );
        }
    }


    playButton.addEventListener(
        "click",
        async () => {

            try {

                if (audio.paused) {
                    await audio.play();
                } else {
                    audio.pause();
                }

            } catch (error) {

                console.error(
                    "Ошибка воспроизведения:",
                    error
                );
            }
        }
    );


    audio.addEventListener(
        "loadedmetadata",
        () => {

            durationElement.textContent =
                formatTime(audio.duration);
        }
    );


    audio.addEventListener(
        "timeupdate",
        () => {

            const duration =
                audio.duration;

            const current =
                audio.currentTime;

            if (Number.isFinite(duration) &&
                duration > 0) {

                const percent =
                    (current / duration) * 100;

                progressFill.style.width =
                    percent + "%";

                progressThumb.style.left =
                    percent + "%";
            }

            currentTimeElement.textContent =
                formatTime(current);

            updateLyrics(current);
        }
    );


    audio.addEventListener(
        "play",
        updatePlayButton
    );

    audio.addEventListener(
        "pause",
        updatePlayButton
    );


    audio.addEventListener(
        "ended",
        () => {

            updatePlayButton();

            progressFill.style.width =
                "0%";

            progressThumb.style.left =
                "0%";

            currentTimeElement.textContent =
                "0:00";

            activeLyricIndex = -1;

            updateLyrics(0);
        }
    );


    /* SEEK */

    function seekFromPointer(clientX) {

        const rect =
            progressContainer.getBoundingClientRect();

        let percent =
            (clientX - rect.left) /
            rect.width;

        percent =
            Math.max(
                0,
                Math.min(1, percent)
            );

        if (Number.isFinite(audio.duration)) {

            audio.currentTime =
                percent * audio.duration;
        }
    }


    progressContainer.addEventListener(
        "pointerdown",
        (event) => {

            progressContainer.setPointerCapture(
                event.pointerId
            );

            seekFromPointer(
                event.clientX
            );
        }
    );


    progressContainer.addEventListener(
        "pointermove",
        (event) => {

            if (
                event.buttons === 1 &&
                progressContainer.hasPointerCapture(
                    event.pointerId
                )
            ) {

                seekFromPointer(
                    event.clientX
                );
            }
        }
    );


    /* LOAD */

    loadLyrics();
    updatePlayButton();

</script>

</body>
</html>
