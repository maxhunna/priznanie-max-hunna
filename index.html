<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    >

    <title>Признание — Max Hunna</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --background: #470509;
            --lyrics-background: #b20d18;
            --white: #ffffff;
            --white-muted: rgba(255, 255, 255, 0.48);
            --white-track: rgba(255, 255, 255, 0.28);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: var(--background);
            color: var(--white);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        body {
            min-height: 100dvh;
            overflow-x: hidden;
        }

        button {
            font: inherit;
        }

        .app {
            width: 100%;
            min-height: 100dvh;

            padding:
                max(12px, env(safe-area-inset-top))
                16px
                max(24px, env(safe-area-inset-bottom));

            background: var(--background);
        }

        .content {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }


        /* =========================
           COVER
        ========================= */

        .cover-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;

            overflow: hidden;

            border-radius: 10px;

            background: #260205;
        }

        .cover {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;

            user-select: none;
            -webkit-user-drag: none;
        }


        /* =========================
           TITLE
        ========================= */

        .title {
            margin-top: 16px;
        }

        .title h1 {
            margin: 0;

            font-size: 26px;
            line-height: 1.1;

            font-weight: 700;

            letter-spacing: -0.5px;
        }

        .title p {
            margin: 5px 0 0;

            font-size: 15px;
            line-height: 1.2;

            font-weight: 500;

            color: rgba(255, 255, 255, 0.62);
        }


        /* =========================
           PLAYER
        ========================= */

        .player {
            margin-top: 18px;
        }

        .time-row {
            display: flex;

            justify-content: space-between;

            margin-bottom: 5px;

            font-size: 12px;

            color: rgba(255, 255, 255, 0.55);

            font-variant-numeric: tabular-nums;
        }


        /* PROGRESS */

        .progress-container {
            position: relative;

            width: 100%;
            height: 24px;

            display: flex;
            align-items: center;

            cursor: pointer;

            touch-action: none;
        }

        .progress-track {
            position: relative;

            width: 100%;
            height: 4px;

            border-radius: 100px;

            background: var(--white-track);
        }

        .progress-fill {
            position: absolute;

            left: 0;
            top: 0;

            width: 0;
            height: 100%;

            border-radius: 100px;

            background: var(--white);
        }

        .progress-thumb {
            position: absolute;

            left: 0;
            top: 50%;

            width: 13px;
            height: 13px;

            border-radius: 50%;

            background: var(--white);

            transform: translate(-50%, -50%);

            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }


        /* CONTROLS */

        .controls {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 30px;

            margin-top: 8px;
        }

        .control-button {
            width: 48px;
            height: 48px;

            border: 0;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--white);

            color: var(--background);

            cursor: pointer;

            transition: transform 0.12s ease;
        }

        .control-button:active {
            transform: scale(0.91);
        }


        /* 10 SECOND ICON */

        .skip-icon {
            position: relative;

            width: 23px;
            height: 23px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .skip-icon svg {
            width: 23px;
            height: 23px;
        }


        /* PLAY */

        .play-button {
            width: 64px;
            height: 64px;
        }

        .play-icon {
            width: 0;
            height: 0;

            margin-left: 4px;

            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 15px solid currentColor;
        }

        .pause-icon {
            display: flex;

            gap: 5px;
        }

        .pause-icon span {
            width: 5px;
            height: 21px;

            border-radius: 1px;

            background: currentColor;
        }


        /* =========================
           LYRICS
        ========================= */

        .lyrics {
            width: 100%;

            margin-top: 24px;

            padding: 22px 18px;

            background: var(--lyrics-background);

            border-radius: 8px;
        }

        .lyrics-scroll {
            width: 100%;

            max-height: 310px;

            overflow-y: auto;

            scrollbar-width: none;

            scroll-behavior: smooth;
        }

        .lyrics-scroll::-webkit-scrollbar {
            display: none;
        }

        .lyric-line {
            width: 100%;

            padding: 5px 0;

            text-align: left;

            font-size: 17px;
            line-height: 1.42;

            font-weight: 700;

            color: var(--white-muted);

            cursor: pointer;

            transition:
                color 0.2s ease,
                opacity 0.2s ease;
        }

        .lyric-line.active {
            color: var(--white);
        }

        .lyric-line:active {
            opacity: 0.65;
        }

        .lyrics-empty {
            text-align: left;

            font-size: 16px;

            color: var(--white-muted);
        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            .app {
                padding-top: 30px;
            }

            .content {
                max-width: 540px;
            }

            .cover-wrapper {
                border-radius: 12px;
            }
        }


        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-height: 700px) {

            .app {
                padding-top: 8px;
            }

            .title {
                margin-top: 12px;
            }

            .title h1 {
                font-size: 24px;
            }

            .player {
                margin-top: 14px;
            }

            .lyrics {
                margin-top: 18px;
                padding: 18px 16px;
            }

            .lyrics-scroll {
                max-height: 245px;
            }
        }
    </style>
</head>


<body>

<div class="app">

    <main class="content">

        <!-- COVER -->

        <div class="cover-wrapper">

            <img
                class="cover"
                src="assets/cover.png"
                alt="Признание"
            >

        </div>


        <!-- TITLE -->

        <div class="title">

            <h1>Признание</h1>

            <p>Max Hunna</p>

        </div>


        <!-- PLAYER -->

        <div class="player">

            <div class="time-row">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>


            <!-- PROGRESS -->

            <div
                class="progress-container"
                id="progressContainer"
            >

                <div class="progress-track">

                    <div
                        class="progress-fill"
                        id="progressFill"
                    ></div>

                    <div
                        class="progress-thumb"
                        id="progressThumb"
                    ></div>

                </div>

            </div>


            <!-- CONTROLS -->

            <div class="controls">

                <!-- BACK 10 -->

                <button
                    class="control-button"
                    id="backButton"
                    aria-label="Назад 10 секунд"
                >

                    <span class="skip-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >

                            <path
                                d="M9 7L4 12L9 17"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                            <path
                                d="M4 12H13C16.866 12 20 15.134 20 19"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                            />

                            <text
                                x="11"
                                y="10"
                                text-anchor="middle"
                                font-size="6"
                                font-weight="700"
                                fill="currentColor"
                                font-family="Arial"
                            >
                                10
                            </text>

                        </svg>

                    </span>

                </button>


                <!-- PLAY -->

                <button
                    class="control-button play-button"
                    id="playButton"
                    aria-label="Воспроизвести"
                >

                    <span class="play-icon"></span>

                </button>


                <!-- FORWARD 10 -->

                <button
                    class="control-button"
                    id="forwardButton"
                    aria-label="Вперёд 10 секунд"
                >

                    <span class="skip-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >

                            <path
                                d="M15 7L20 12L15 17"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                            <path
                                d="M20 12H11C7.134 12 4 15.134 4 19"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                            />

                            <text
                                x="13"
                                y="10"
                                text-anchor="middle"
                                font-size="6"
                                font-weight="700"
                                fill="currentColor"
                                font-family="Arial"
                            >
                                10
                            </text>

                        </svg>

                    </span>

                </button>

            </div>

        </div>


        <!-- LYRICS -->

        <section class="lyrics">

            <div
                class="lyrics-scroll"
                id="lyricsScroll"
            >

                <div
                    class="lyrics-empty"
                    id="lyricsEmpty"
                >
                    Загрузка текста…
                </div>

            </div>

        </section>

    </main>

</div>


<!-- AUDIO -->

<audio
    id="audio"
    preload="metadata"
    playsinline
>

    <source
        src="assets/song.mp3"
        type="audio/mpeg"
    >

</audio>


<script>

    /* ==========================================
       TELEGRAM
    ========================================== */

    const tg =
        window.Telegram?.WebApp;

    if (tg) {

        tg.ready();

        tg.expand();

        if (tg.setHeaderColor) {
            tg.setHeaderColor("#470509");
        }

        if (tg.setBackgroundColor) {
            tg.setBackgroundColor("#470509");
        }
    }


    /* ==========================================
       ELEMENTS
    ========================================== */

    const audio =
        document.getElementById("audio");

    const playButton =
        document.getElementById("playButton");

    const backButton =
        document.getElementById("backButton");

    const forwardButton =
        document.getElementById("forwardButton");

    const progressContainer =
        document.getElementById(
            "progressContainer"
        );

    const progressFill =
        document.getElementById(
            "progressFill"
        );

    const progressThumb =
        document.getElementById(
            "progressThumb"
        );

    const currentTimeElement =
        document.getElementById(
            "currentTime"
        );

    const durationElement =
        document.getElementById(
            "duration"
        );

    const lyricsScroll =
        document.getElementById(
            "lyricsScroll"
        );

    const lyricsEmpty =
        document.getElementById(
            "lyricsEmpty"
        );


    /* ==========================================
       LYRICS
    ========================================== */

    let lyrics = [];

    let activeLyricIndex = -1;


    /*
       Поддерживаются обычные LRC:

       [00:12.50]Текст строки

       Также поддерживаются:

       [01:02]Текст строки
    */

    function parseLRC(text) {

        const result = [];

        const lines =
            text.split(/\r?\n/);

        for (const line of lines) {

            const matches = [
                ...line.matchAll(
                    /\[(\d+):(\d+(?:\.\d+)?)\]/g
                )
            ];

            if (!matches.length) {
                continue;
            }

            const textPart =
                line
                    .replace(
                        /\[\d+:\d+(?:\.\d+)?\]/g,
                        ""
                    )
                    .trim();


            for (const match of matches) {

                const minutes =
                    Number(match[1]);

                const seconds =
                    Number(match[2]);

                const time =
                    minutes * 60 +
                    seconds;

                result.push({
                    time,
                    text: textPart
                });
            }
        }


        result.sort(
            (a, b) =>
                a.time - b.time
        );


        return result;
    }


    async function loadLyrics() {

        try {

            /*
                Добавляем timestamp к URL,
                чтобы браузер не показывал
                старый LRC из кэша.
            */

            const response =
                await fetch(
                    "assets/lyrics.lrc?v=" +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "LRC HTTP " +
                    response.status
                );
            }


            const text =
                await response.text();


            lyrics =
                parseLRC(text);


            renderLyrics();


        } catch (error) {

            console.error(
                "Ошибка загрузки LRC:",
                error
            );


            lyricsEmpty.textContent =
                "Текст песни пока недоступен.";
        }
    }


    function renderLyrics() {

        lyricsScroll.innerHTML = "";


        if (!lyrics.length) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "lyrics-empty";

            empty.textContent =
                "Текст песни пока недоступен.";

            lyricsScroll.appendChild(
                empty
            );

            return;
        }


        lyrics.forEach(
            (line, index) => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "lyric-line";


                element.dataset.index =
                    index;


                element.textContent =
                    line.text || " ";


                /*
                    ВАЖНО:

                    Теперь каждая строка
                    является кнопкой перемотки.
                */

                element.addEventListener(
                    "click",
                    async () => {

                        audio.currentTime =
                            line.time;

                        activeLyricIndex =
                            index;

                        updateLyrics(
                            line.time,
                            true
                        );


                        /*
                            Если трек был остановлен,
                            нажатие на строку
                            автоматически запускает его.
                        */

                        try {

                            if (audio.paused) {

                                await audio.play();
                            }

                        } catch (error) {

                            console.error(
                                "Не удалось запустить трек:",
                                error
                            );
                        }
                    }
                );


                lyricsScroll.appendChild(
                    element
                );
            }
        );
    }


    function updateLyrics(
        time,
        forceScroll = false
    ) {

        if (!lyrics.length) {
            return;
        }


        let newIndex = -1;


        for (
            let i = 0;
            i < lyrics.length;
            i++
        ) {

            if (
                time >=
                lyrics[i].time
            ) {

                newIndex = i;

            } else {

                break;
            }
        }


        if (
            newIndex ===
            activeLyricIndex &&
            !forceScroll
        ) {

            return;
        }


        activeLyricIndex =
            newIndex;


        const elements =
            lyricsScroll.querySelectorAll(
                ".lyric-line"
            );


        elements.forEach(
            (element, index) => {

                element.classList.toggle(
                    "active",
                    index ===
                    activeLyricIndex
                );
            }
        );


        if (
            activeLyricIndex >= 0
        ) {

            const activeElement =
                elements[
                    activeLyricIndex
                ];


            if (activeElement) {

                activeElement.scrollIntoView({
                    behavior:
                        forceScroll
                            ? "smooth"
                            : "smooth",

                    block: "center"
                });
            }
        }
    }


    /* ==========================================
       TIME
    ========================================== */

    function formatTime(
        seconds
    ) {

        if (
            !Number.isFinite(
                seconds
            )
        ) {

            return "0:00";
        }


        const minutes =
            Math.floor(
                seconds / 60
            );


        const secs =
            Math.floor(
                seconds % 60
            );


        return (
            minutes +
            ":" +
            String(secs)
                .padStart(2, "0")
        );
    }


    /* ==========================================
       PLAY BUTTON
    ========================================== */

    function updatePlayButton() {

        if (audio.paused) {

            playButton.innerHTML =
                '<span class="play-icon"></span>';

            playButton.setAttribute(
                "aria-label",
                "Воспроизвести"
            );

        } else {

            playButton.innerHTML = `
                <span class="pause-icon">
                    <span></span>
                    <span></span>
                </span>
            `;

            playButton.setAttribute(
                "aria-label",
                "Пауза"
            );
        }
    }


    playButton.addEventListener(
        "click",
        async () => {

            try {

                if (
                    audio.paused
                ) {

                    await audio.play();

                } else {

                    audio.pause();
                }

            } catch (error) {

                console.error(
                    "Ошибка воспроизведения:",
                    error
                );
            }
        }
    );


    /* ==========================================
       10 SEC BACK
    ========================================== */

    backButton.addEventListener(
        "click",
        () => {

            audio.currentTime =
                Math.max(
                    0,
                    audio.currentTime - 10
                );


            updateLyrics(
                audio.currentTime,
                true
            );
        }
    );


    /* ==========================================
       10 SEC FORWARD
    ========================================== */

    forwardButton.addEventListener(
        "click",
        () => {

            audio.currentTime =
                Math.min(
                    audio.duration || Infinity,
                    audio.currentTime + 10
                );


            updateLyrics(
                audio.currentTime,
                true
            );
        }
    );


    /* ==========================================
       AUDIO METADATA
    ========================================== */

    audio.addEventListener(
        "loadedmetadata",
        () => {

            durationElement.textContent =
                formatTime(
                    audio.duration
                );
        }
    );


    /* ==========================================
       AUDIO TIME UPDATE
    ========================================== */

    audio.addEventListener(
        "timeupdate",
        () => {

            const duration =
                audio.duration;

            const current =
                audio.currentTime;


            if (
                Number.isFinite(
                    duration
                ) &&
                duration > 0
            ) {

                const percent =
                    (
                        current /
                        duration
                    ) * 100;


                progressFill.style.width =
                    percent + "%";


                progressThumb.style.left =
                    percent + "%";
            }


            currentTimeElement.textContent =
                formatTime(
                    current
                );


            updateLyrics(
                current
            );
        }
    );


    audio.addEventListener(
        "play",
        updatePlayButton
    );


    audio.addEventListener(
        "pause",
        updatePlayButton
    );


    /* ==========================================
       END
    ========================================== */

    audio.addEventListener(
        "ended",
        () => {

            updatePlayButton();


            progressFill.style.width =
                "0%";


            progressThumb.style.left =
                "0%";


            currentTimeElement.textContent =
                "0:00";


            activeLyricIndex =
                -1;


            updateLyrics(0);
        }
    );


    /* ==========================================
       PROGRESS SEEK
    ========================================== */

    function seekFromPointer(
        clientX
    ) {

        const rect =
            progressContainer
                .getBoundingClientRect();


        let percent =
            (
                clientX -
                rect.left
            ) /
            rect.width;


        percent =
            Math.max(
                0,
                Math.min(
                    1,
                    percent
                )
            );


        if (
            Number.isFinite(
                audio.duration
            )
        ) {

            audio.currentTime =
                percent *
                audio.duration;


            updateLyrics(
                audio.currentTime,
                true
            );
        }
    }


    progressContainer.addEventListener(
        "pointerdown",
        (event) => {

            progressContainer.setPointerCapture(
                event.pointerId
            );


            seekFromPointer(
                event.clientX
            );
        }
    );


    progressContainer.addEventListener(
        "pointermove",
        (event) => {

            if (
                event.buttons === 1 &&
                progressContainer.hasPointerCapture(
                    event.pointerId
                )
            ) {

                seekFromPointer(
                    event.clientX
                );
            }
        }
    );


    /* ==========================================
       START
    ========================================== */

    loadLyrics();

    updatePlayButton();

</script>

</body>
</html>
