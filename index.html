<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f8f7f4">
  <title>Признание — Max Hunna</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#f7f6f2;
      --paper:#fffefa;
      --ink:#161616;
      --muted:#8b8985;
      --line:#dedbd5;
      --red:#a51422;
      --red-soft:#c62b38;
      --shadow:0 18px 55px rgba(39,29,25,.10);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Segoe UI,Arial,sans-serif}
    body{overflow-x:hidden}
    button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
    .app{width:min(100%,520px);margin:0 auto;padding:calc(18px + var(--safe-top)) 20px calc(34px + var(--safe-bottom));}
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .top .eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:650}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px rgba(165,20,34,.08)}
    .cover-wrap{position:relative;width:100%;aspect-ratio:1/1;border-radius:25px;overflow:hidden;background:#eee;box-shadow:var(--shadow)}
    .cover{width:100%;height:100%;object-fit:cover;display:block}
    .cover-wrap:after{content:"";position:absolute;inset:0;border-radius:25px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.045);pointer-events:none}
    .meta{padding:21px 2px 11px}
    .title{font-size:27px;line-height:1.05;font-weight:760;letter-spacing:-.035em}
    .artist{margin-top:7px;font-size:15px;color:var(--muted);font-weight:560}
    .progress-area{margin-top:13px}
    .range{appearance:none;width:100%;height:20px;background:transparent;margin:0;display:block}
    .range::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--red) var(--progress,0%),#d7d4ce var(--progress,0%));border-radius:10px}
    .range::-moz-range-track{height:3px;background:#d7d4ce;border-radius:10px}
    .range::-moz-range-progress{height:3px;background:var(--red);border-radius:10px}
    .range::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;background:var(--red);margin-top:-5px;box-shadow:0 1px 5px rgba(0,0,0,.18)}
    .range::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--red)}
    .times{display:flex;justify-content:space-between;color:#8c8984;font-size:11px;font-variant-numeric:tabular-nums;margin-top:-1px}
    .controls{display:flex;align-items:center;justify-content:center;gap:27px;margin:11px 0 23px}
    .control{width:35px;height:35px;display:grid;place-items:center}
    .control svg{width:23px;height:23px;fill:currentColor}
    .control.skip svg{width:25px;height:25px}
    .play{width:61px;height:61px;border-radius:50%;background:var(--ink);color:white;display:grid;place-items:center;box-shadow:0 9px 22px rgba(0,0,0,.13);transition:transform .15s ease}
    .play:active{transform:scale(.95)}
    .play svg{width:24px;height:24px;margin-left:2px}
    .lyrics{margin-top:5px;padding:4px 0 30px;position:relative}
    .lyrics:before,.lyrics:after{content:"";position:absolute;left:0;right:0;height:44px;z-index:2;pointer-events:none}
    .lyrics:before{top:0;background:linear-gradient(var(--bg),rgba(247,246,242,0))}
    .lyrics:after{bottom:0;background:linear-gradient(rgba(247,246,242,0),var(--bg))}
    .lyrics-scroller{height:360px;overflow-y:auto;scroll-behavior:smooth;scrollbar-width:none;padding:150px 3px 150px}
    .lyrics-scroller::-webkit-scrollbar{display:none}
    .lyric{font-size:23px;line-height:1.27;letter-spacing:-.025em;font-weight:650;color:#c1bdb7;padding:7px 0;transform-origin:left center;transition:color .35s ease,transform .35s ease,opacity .35s ease}
    .lyric.active{color:var(--ink);transform:scale(1.025)}
    .lyric.past{color:#aaa59f}
    .hint{font-size:11px;color:#a29e98;text-align:center;margin-top:2px;letter-spacing:.02em}
    .loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(247,246,242,.92);font-size:13px;color:var(--muted);z-index:10}
    .loading.hidden{display:none}
    @media (min-width:520px){.app{padding-left:26px;padding-right:26px}.cover-wrap{border-radius:28px}}
    @media (max-height:720px){.lyrics-scroller{height:285px}.lyric{font-size:20px}.cover-wrap{max-height:52vh;aspect-ratio:1/1}}
  </style>
</head>
<body>
  <main class="app">
    <div class="top"><div class="eyebrow">для тебя</div><div class="dot"></div></div>
    <section class="cover-wrap">
      <img class="cover" src="assets/cover.png" alt="Обложка">
      <div class="loading" id="loading">Загрузка музыки…</div>
    </section>

    <section class="meta">
      <div class="title">Признание</div>
      <div class="artist">Max Hunna</div>
    </section>

    <section class="progress-area">
      <input class="range" id="seek" type="range" min="0" max="142.733" step="0.01" value="0" aria-label="Перемотка">
      <div class="times"><span id="current">0:00</span><span id="duration">2:23</span></div>
    </section>

    <div class="controls">
      <button class="control skip" id="back" aria-label="Назад на 10 секунд">
        <svg viewBox="0 0 24 24"><path d="M11 6V3L6 7.5 11 12V9c3.2 0 5.5 2.1 5.5 5s-2.3 5-5.5 5a6 6 0 0 1-5.5-3.5l-1.8.9A8 8 0 0 0 11 21c4.4 0 7.5-3 7.5-7s-3.1-8-7.5-8Z"/><path d="M3 7h2v6H3z"/></svg>
      </button>
      <button class="play" id="play" aria-label="Воспроизвести">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5.2v13.6c0 .9 1 1.4 1.8.9l10-6.8c.7-.5.7-1.5 0-2l-10-6.8C9 3.8 8 4.3 8 5.2Z"/></svg>
      </button>
      <button class="control skip" id="forward" aria-label="Вперёд на 10 секунд">
        <svg viewBox="0 0 24 24"><path d="M13 6V3l5 4.5-5 4.5V9c-3.2 0-5.5 2.1-5.5 5S9.8 19 13 19a6 6 0 0 0 5.5-3.5l1.8.9A8 8 0 0 1 13 21c-4.4 0-7.5-3-7.5-7s3.1-8 7.5-8Z"/><path d="M19 7h2v6h-2z"/></svg>
      </button>
    </div>

    <section class="lyrics" aria-label="Текст песни">
      <div class="lyrics-scroller" id="lyrics"></div>
      <div class="hint">нажми на строку, чтобы перейти к этому моменту</div>
    </section>
  </main>

  <audio id="audio" preload="metadata" src="assets/song.mp3"></audio>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#f7f6f2'); tg.setBackgroundColor('#f7f6f2'); }

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const playIcon = document.getElementById('playIcon');
    const seek = document.getElementById('seek');
    const currentEl = document.getElementById('current');
    const durationEl = document.getElementById('duration');
    const lyricsEl = document.getElementById('lyrics');
    const loading = document.getElementById('loading');

    let lines = [];
    let activeIndex = -1;
    let raf = null;

    function formatTime(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(sec / 60), s = String(sec % 60).padStart(2,'0');
      return `${m}:${s}`;
    }

    function parseLRC(text) {
      return text.split(/\r?\n/).flatMap(line => {
        const matches = [...line.matchAll(/\[(\d{2}):(\d{2}(?:\.\d+)?)\]/g)];
        const lyric = line.replace(/\[\d{2}:\d{2}(?:\.\d+)?\]/g, '').trim();
        return matches.map(m => ({ time: Number(m[1]) * 60 + Number(m[2]), text: lyric }));
      }).filter(x => x.text).sort((a,b) => a.time - b.time);
    }

    async function loadLyrics() {
      const res = await fetch('assets/lyrics.lrc');
      lines = parseLRC(await res.text());
      lyricsEl.innerHTML = lines.map((line, i) => `<button class="lyric" data-index="${i}">${escapeHtml(line.text)}</button>`).join('');
      lyricsEl.querySelectorAll('.lyric').forEach(el => el.addEventListener('click', () => {
        const i = Number(el.dataset.index); audio.currentTime = lines[i].time; if (audio.paused) audio.play();
      }));
    }

    function escapeHtml(s) { return s.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

    function updateLyric(t) {
      if (!lines.length) return;
      let lo = 0, hi = lines.length - 1, idx = -1;
      while (lo <= hi) { const mid = (lo + hi) >> 1; if (lines[mid].time <= t + 0.02) { idx = mid; lo = mid + 1; } else hi = mid - 1; }
      if (idx === activeIndex) return;
      activeIndex = idx;
      [...lyricsEl.children].forEach((el, i) => {
        el.classList.toggle('active', i === idx);
        el.classList.toggle('past', i < idx);
      });
      const active = lyricsEl.children[idx];
      if (active) active.scrollIntoView({behavior:'smooth', block:'center'});
    }

    function tick() {
      const t = audio.currentTime || 0;
      const d = audio.duration || 142.733;
      seek.value = t;
      seek.max = d;
      seek.style.setProperty('--progress', `${d ? (t/d)*100 : 0}%`);
      currentEl.textContent = formatTime(t);
      durationEl.textContent = formatTime(d);
      updateLyric(t);
      if (!audio.paused) raf = requestAnimationFrame(tick);
    }

    function setPlaying(isPlaying) {
      playIcon.innerHTML = isPlaying
        ? '<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>'
        : '<path d="M8 5.2v13.6c0 .9 1 1.4 1.8.9l10-6.8c.7-.5.7-1.5 0-2l-10-6.8C9 3.8 8 4.3 8 5.2Z"/>';
    }

    playBtn.addEventListener('click', async () => {
      if (audio.paused) { await audio.play(); } else audio.pause();
      setPlaying(!audio.paused); tick();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });
    document.getElementById('back').addEventListener('click', () => audio.currentTime = Math.max(0, audio.currentTime - 10));
    document.getElementById('forward').addEventListener('click', () => audio.currentTime = Math.min(audio.duration || 142.733, audio.currentTime + 10));
    seek.addEventListener('input', () => { audio.currentTime = Number(seek.value); tick(); });
    audio.addEventListener('loadedmetadata', () => { seek.max = audio.duration; durationEl.textContent = formatTime(audio.duration); loading.classList.add('hidden'); tick(); });
    audio.addEventListener('canplay', () => loading.classList.add('hidden'));
    audio.addEventListener('play', () => { setPlaying(true); cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); });
    audio.addEventListener('pause', () => { setPlaying(false); cancelAnimationFrame(raf); tick(); });
    audio.addEventListener('ended', () => { setPlaying(false); audio.currentTime = 0; tick(); });
    audio.addEventListener('error', () => { loading.textContent = 'Не удалось загрузить аудио'; });

    loadLyrics().catch(() => { lyricsEl.innerHTML = '<div class="lyric active">Текст пока недоступен</div>'; });
  </script>
</body>
</html>
